<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Westbridge National Bank. Demo only; no real money is held." />
    <meta name="theme-color" content="#6B1D2A" />
    <meta property="og:title" content="Westbridge National Bank" />
    <meta property="og:description" content="A simulated bank for learning. Demo only." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.test/" />
    <title>Westbridge National Bank</title>
    <script>
      (function () {
        const root = document.documentElement;
        try {
          const savedLanguage = window.localStorage.getItem('westbridge.lang');
          const preferredLanguage = savedLanguage || (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
          const normalizedLanguage = preferredLanguage.trim().replaceAll('_', '-');
          const baseLanguage = normalizedLanguage.split('-')[0].toLowerCase();
          const enabledLanguages = ["en","es","fr","pt","de","it","tr","ar"];
          const language = baseLanguage === 'zh' ? 'zh-CN' : baseLanguage;
          root.lang = enabledLanguages.includes(language) ? language : 'en';
          root.dir = ['ar', 'fa', 'ur'].includes(root.lang) ? 'rtl' : 'ltr';
        } catch {
          root.lang = 'en';
          root.dir = 'ltr';
        }

        try {
          const storageKey = 'westbridge-theme';
          const saved = window.localStorage.getItem(storageKey);
          const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = saved === 'light' || saved === 'dark' ? saved : (saved === 'system' || !saved ? (systemDark ? 'dark' : 'light') : (systemDark ? 'dark' : 'light'));
          root.classList.toggle('dark', resolved === 'dark');
          root.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <style>
      :root {
        --app-loader-bg: var(--brand-cream);
        --app-loader-burgundy: var(--brand-burgundy, #6B1D2A);
        --app-loader-bronze: var(--brand-bronze, #C08A6B);
        --app-loader-stone: var(--brand-stone, #D9CFC3);
        --app-loader-overlay: rgba(42, 35, 39, 0.04);
      }
      .dark {
        --app-loader-bg: var(--brand-ink, #2A2327);
        --app-loader-burgundy: #B76A76;
        --app-loader-bronze: #D8A785;
        --app-loader-stone: #B7AEA5;
        --app-loader-overlay: rgba(255, 255, 255, 0.04);
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 99999;
        background: var(--app-loader-bg);
        opacity: 1;
        transition: opacity 400ms ease;
      }
      #app-loader.is-hiding {
        opacity: 0;
      }
      #app-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--app-loader-overlay);
      }
      #app-loader .loader-orbit {
        position: relative;
        width: 72px;
        height: 72px;
        display: block;
      }
      #app-loader .loader-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        border-radius: 9999px;
        box-shadow: 0 0 18px currentColor;
        animation: orbit 1.4s ease-in-out infinite;
        transform-origin: center;
      }
      #app-loader .loader-dot:nth-child(1) {
        color: var(--app-loader-burgundy);
        background: var(--app-loader-burgundy);
        animation-delay: 0s;
      }
      #app-loader .loader-dot:nth-child(2) {
        color: var(--app-loader-bronze);
        background: var(--app-loader-bronze);
        animation-delay: 0.2s;
      }
      #app-loader .loader-dot:nth-child(3) {
        color: var(--app-loader-stone);
        background: var(--app-loader-stone);
        animation-delay: 0.4s;
      }
      @keyframes orbit {
        0% {
          transform: rotate(0deg) translateX(20px) scale(0.8);
        }
        25% {
          transform: rotate(90deg) translateX(22px) scale(1);
        }
        50% {
          transform: rotate(180deg) translateX(18px) scale(1.05);
        }
        75% {
          transform: rotate(270deg) translateX(22px) scale(0.9);
        }
        100% {
          transform: rotate(360deg) translateX(20px) scale(0.8);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .loader-dot {
          animation: none;
          opacity: 0.8;
          transform: scale(1);
        }
        #app-loader {
          transition: opacity 0ms linear;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      /* The theme tokens are intentionally duplicated here because the main stylesheet has not loaded yet. */
    </style>
    <noscript><style>#app-loader{display:none}</style></noscript>
  </head>
  <body>
    <div id="app-loader" role="status" aria-live="polite" aria-busy="true">
      <span class="loader-orbit" aria-hidden="true">
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </span>
      <span class="sr-only" id="app-loader-label">Loading Westbridge National Bank</span>
    </div>
    <script>
      (function () {
        const labels = {
          en: 'Loading Westbridge National Bank',
          es: 'Cargando Westbridge National Bank',
          fr: 'Chargement de Westbridge National Bank',
          pt: 'Carregando Westbridge National Bank',
          de: 'Westbridge National Bank wird geladen',
          it: 'Caricamento di Westbridge National Bank',
          ar: 'جارٍ تحميل Westbridge National Bank',
          fa: 'در حال بارگذاری Westbridge National Bank',
          ur: 'Westbridge National Bank لوڈ ہو رہا ہے',
          hi: 'Westbridge National Bank लोड हो रहा है',
          bn: 'Westbridge National Bank লোড হচ্ছে',
          id: 'Memuat Westbridge National Bank',
          sw: 'Inapakia Westbridge National Bank',
          tr: 'Westbridge National Bank yükleniyor',
          'zh-CN': '正在加载 Westbridge National Bank',
          ja: 'Westbridge National Bankを読み込み中',
          ko: 'Westbridge National Bank 불러오는 중',
          vi: 'Đang tải Westbridge National Bank',
          ru: 'Загрузка Westbridge National Bank',
          pl: 'Wczytywanie Westbridge National Bank',
        }
        let saved = null
        try {
          saved = window.localStorage.getItem('westbridge.lang')
        } catch (error) {
          saved = null
        }
        const candidates = [saved, ...(navigator.languages || []), navigator.language]
          .filter(Boolean)
          .map((value) => value.trim().replaceAll('_', '-'))
        const language = candidates.map((value) => {
          if (labels[value]) return value
          const base = value.split('-')[0].toLowerCase()
          return base === 'zh' ? 'zh-CN' : (labels[base] ? base : null)
        }).find(Boolean) || 'en'
        const label = document.getElementById('app-loader-label')
        if (label) label.textContent = labels[language]
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
